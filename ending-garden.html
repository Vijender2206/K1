<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gulaabon Wala Raasta 🌹</title>
<meta name="theme-color" content="#CDEBF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21C7 16.5 2 12.5 2 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-5 8.5-10 13Z' fill='%23FF6B93' stroke='%234A2B3A' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@500;600;700&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="page pg-garden" data-hearts>

  <nav class="corner-nav">
    <a class="chip" data-nav href="choose.html">← raasta badlo</a>
  </nav>

  <main class="scene" data-parallax>
    <div class="sun" data-depth=".25"></div>
    <div class="cloud" data-depth=".45" style="width:130px;height:40px;top:14%;animation-duration:40s"></div>
    <div class="cloud" data-depth=".35" style="width:95px;height:30px;top:7%;animation-duration:52s;animation-delay:-26s"></div>
    <span class="butterfly" style="left:12%;top:40%">🦋</span>
    <span class="butterfly" style="right:10%;top:30%;animation-delay:-4.5s">🦋</span>

    <div class="garden-ground"></div>
    <div class="garden-row back" id="rowBack"></div>
    <div class="garden-row" id="rowFront"></div>

    <div class="stack">
      <span class="eyebrow">ENDING 1 · GULAABON KA BAGEECHA</span>

      <div class="ring-stage" data-ring></div>

      <div class="couple-row">
        <div class="kneel" data-sticker="panda-kneel"></div>
        <div class="shy" data-sticker="bear-blush"></div>
      </div>

      <div class="proposal-zone sticker-card" style="position:relative">
        <div class="tape"></div>
        <p class="quiz-note" style="font-size:1.45rem">Maine har gulaab se poochha… sab bole “go for it!” 🌹</p>
        <p class="proposal-q">Will you be my <span class="hl">girlfriend</span>, meri jaan?</p>
        <div class="answer-row">
          <a id="yesBtn" class="btn btn-love btn-big" data-celebrate href="yes.html?via=garden">HAAN! Yes! 💖</a>
          <button type="button" class="btn btn-no" data-dodge data-yes-url="yes.html?via=garden">Hmm… nahi?</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/stickers.js?v=3" defer></script>
  <script src="js/shared.js?v=3" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const fill = (row, n, kinds) => {
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.innerHTML = L1Stickers.html(kinds[i % kinds.length]);
          row.appendChild(d);
        }
      };
      fill(document.getElementById("rowBack"), 8, ["tulip", "rose"]);
      fill(document.getElementById("rowFront"), 7, ["rose", "tulip"]);
    });
  </script>
</body>
</html>
